name: Sync Fork on PR Merge

on:
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:

jobs:
  sync-fork:
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Sincronizar rama main con el Fork
        env:
          FORK_PAT: ${{ secrets.FORK_SYNC_PAT }}
        run: |
          # Clona la rama main del repo origen usando el token interno de GitHub
          git clone --branch main --single-branch "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" repo
          cd repo
          
          # Hace push forzado a la rama main de tu fork
          git push "https://x-access-token:${FORK_PAT}@github.com/RobertoUNA/UniTutor-Frontend.git" main:main --force
